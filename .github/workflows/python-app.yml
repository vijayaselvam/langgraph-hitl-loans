name: Python Application Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Syntax Check
      run: |
        # Check for syntax errors without running the interactive script
        python -m py_compile loan_sanction_application.py
        python -m py_compile show_all_threads.py
        
    - name: Test Graph Compilation
      run: |
        # show_all_threads.py imports the graph from loan_sanction_application.py 
        # but does not trigger the interactive input() loop.
        # This will verify that the graph compiles and the sqlite checkpoint logic works.
        python show_all_threads.py
